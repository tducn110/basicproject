[package]
name = "caro-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic 15x15 freestyle Gomoku engine and search in Rust"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
